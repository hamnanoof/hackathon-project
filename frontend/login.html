<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Subscript</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/auth.js"></script>
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="/">Subscript<span>.</span></a>
  <main class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Sign in</h1>
    <p class="muted">Pick up where you left off.</p>
    <form id="login-form" class="stack-form">
      <label>Email address<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button full-width" type="submit">Sign in</button>
      <p id="form-message" class="form-message" role="status"></p>
    </form>
    <p class="auth-foot">New to Subscript? <a href="/register.html">Create an account</a></p>
  </main>
</body>
</html>
